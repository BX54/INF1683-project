# Netlify : construit le site à chaque « git push » sur main.
# Les en-têtes de sécurité et le cache sont dans public/_headers.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12"

# Fonction serveur de la commande en ligne (netlify/functions/commande.mjs → /api/commande)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
